<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイ Riruka</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:12px;background:#111;color:#eee}
textarea,input,select,button{width:100%;box-sizing:border-box;margin:4px 0;padding:8px;background:#222;color:#eee;border:1px solid #444;border-radius:6px}
button{background:#3a6;cursor:pointer;font-weight:bold}details{margin:8px 0;border:1px solid #333;padding:8px;border-radius:6px}
.row{display:flex;gap:8px}.row>*{flex:1}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.card{background:#1b1b1b;padding:6px;border-radius:6px;font-size:12px}.card img,.card video{width:100%}small{color:#999}
</style></head><body>
<h2>マイ Riruka</h2>
<details id="set"><summary>⚙ 設定（APIキー・エンドポイント）</summary>
<label>RunPod APIキー（このブラウザのlocalStorageにだけ保存）</label><input id="key" type="password">
<label>共通エンドポイントID（各モデルで空欄ならこれを使用。動画・Qwenは同じworker-comfyuiで可）</label><input id="shared">
<p><small>モデルごとに「表示名 / エンドポイントID / 種類(t2i,t2v,i2v) / ワークフローJSON(API形式)」を登録します。
ワークフロー内の <code>{{PROMPT}}</code> <code>{{NEGATIVE}}</code> <code>{{SEED}}</code> <code>{{WIDTH}}</code> <code>{{HEIGHT}}</code> <code>{{FRAMES}}</code> <code>{{IMAGE}}</code>（入力画像ファイル名）が置き換えられます。</small></p>
<div id="models"></div><button id="add" style="background:#456">＋ モデルを追加</button>
<button id="reset" style="background:#654">プリセットに戻す</button><button id="save">設定を保存</button></details>

<label>モデル</label><select id="model"></select>
<label>プロンプト</label><textarea id="prompt" rows="4"></textarea>
<label>ネガティブプロンプト</label><textarea id="neg" rows="2"></textarea>
<div class="row"><div><label>幅</label><input id="w" type="number" value="720"></div><div><label>高さ</label><input id="h" type="number" value="1280"></div>
<div><label>フレーム数</label><input id="f" type="number" value="81"></div><div><label>シード(空=ランダム)</label><input id="seed" type="number"></div></div>
<div id="imgbox"><label>入力画像（i2v用）</label><input id="img" type="file" accept="image/*"><img id="prev" style="max-height:160px"></div>
<button id="go">生成する</button>
<div id="status"></div><h3>結果</h3><div id="gallery"></div>

<script>
const $=id=>document.getElementById(id);
const FLUX="{\n \"5\": {\n  \"inputs\": {\n   \"width\": \"{{WIDTH}}\",\n   \"height\": \"{{HEIGHT}}\",\n   \"batch_size\": 1\n  },\n  \"class_type\": \"EmptyLatentImage\",\n  \"_meta\": {\n   \"title\": \"Empty Latent Image\"\n  }\n },\n \"6\": {\n  \"inputs\": {\n   \"text\": \"{{PROMPT}}\",\n   \"clip\": [\n    \"11\",\n    0\n   ]\n  },\n  \"class_type\": \"CLIPTextEncode\",\n  \"_meta\": {\n   \"title\": \"CLIP Text Encode (Prompt)\"\n  }\n },\n \"8\": {\n  \"inputs\": {\n   \"samples\": [\n    \"13\",\n    0\n   ],\n   \"vae\": [\n    \"10\",\n    0\n   ]\n  },\n  \"class_type\": \"VAEDecode\",\n  \"_meta\": {\n   \"title\": \"VAE Decode\"\n  }\n },\n \"9\": {\n  \"inputs\": {\n   \"filename_prefix\": \"ComfyUI\",\n   \"images\": [\n    \"8\",\n    0\n   ]\n  },\n  \"class_type\": \"SaveImage\",\n  \"_meta\": {\n   \"title\": \"Save Image\"\n  }\n },\n \"10\": {\n  \"inputs\": {\n   \"vae_name\": \"ae.safetensors\"\n  },\n  \"class_type\": \"VAELoader\",\n  \"_meta\": {\n   \"title\": \"Load VAE\"\n  }\n },\n \"11\": {\n  \"inputs\": {\n   \"clip_name1\": \"t5xxl_fp8_e4m3fn.safetensors\",\n   \"clip_name2\": \"clip_l.safetensors\",\n   \"type\": \"flux\"\n  },\n  \"class_type\": \"DualCLIPLoader\",\n  \"_meta\": {\n   \"title\": \"DualCLIPLoader\"\n  }\n },\n \"12\": {\n  \"inputs\": {\n   \"unet_name\": \"flux1-schnell.safetensors\",\n   \"weight_dtype\": \"fp8_e4m3fn\"\n  },\n  \"class_type\": \"UNETLoader\",\n  \"_meta\": {\n   \"title\": \"Load Diffusion Model\"\n  }\n },\n \"13\": {\n  \"inputs\": {\n   \"noise\": [\n    \"25\",\n    0\n   ],\n   \"guider\": [\n    \"22\",\n    0\n   ],\n   \"sampler\": [\n    \"16\",\n    0\n   ],\n   \"sigmas\": [\n    \"17\",\n    0\n   ],\n   \"latent_image\": [\n    \"5\",\n    0\n   ]\n  },\n  \"class_type\": \"SamplerCustomAdvanced\",\n  \"_meta\": {\n   \"title\": \"SamplerCustomAdvanced\"\n  }\n },\n \"16\": {\n  \"inputs\": {\n   \"sampler_name\": \"euler\"\n  },\n  \"class_type\": \"KSamplerSelect\",\n  \"_meta\": {\n   \"title\": \"KSamplerSelect\"\n  }\n },\n \"17\": {\n  \"inputs\": {\n   \"scheduler\": \"sgm_uniform\",\n   \"steps\": 4,\n   \"denoise\": 1,\n   \"model\": [\n    \"12\",\n    0\n   ]\n  },\n  \"class_type\": \"BasicScheduler\",\n  \"_meta\": {\n   \"title\": \"BasicScheduler\"\n  }\n },\n \"22\": {\n  \"inputs\": {\n   \"model\": [\n    \"12\",\n    0\n   ],\n   \"conditioning\": [\n    \"6\",\n    0\n   ]\n  },\n  \"class_type\": \"BasicGuider\",\n  \"_meta\": {\n   \"title\": \"BasicGuider\"\n  }\n },\n \"25\": {\n  \"inputs\": {\n   \"noise_seed\": \"{{SEED}}\"\n  },\n  \"class_type\": \"RandomNoise\",\n  \"_meta\": {\n   \"title\": \"RandomNoise\"\n  }\n }\n}";
const PRESETS=[{"name": "FLUX schnell（画像）", "type": "t2i", "wf": FLUX, "ep": "u6r4eaf7gb1um8"}, {"name": "Qwen-Image 2.1（画像）※要ワークフロー", "type": "t2i", "wf": "/* TODO: Qwen-Image 2.1 のComfyUIワークフロー(API形式)をここに貼る。ComfyUI公式テンプレートを開き「Export (API)」で書き出し、プロンプト等を {{PROMPT}} などに置換 */", "ep": "t2sacs5crp67h3"}, {"name": "Wan 2.2 5B テキスト→動画 ※要検証", "type": "t2v", "wf": "{\n \"1\": {\n  \"class_type\": \"UNETLoader\",\n  \"inputs\": {\n   \"unet_name\": \"wan2.2_ti2v_5B_fp16.safetensors\",\n   \"weight_dtype\": \"default\"\n  }\n },\n \"2\": {\n  \"class_type\": \"CLIPLoader\",\n  \"inputs\": {\n   \"clip_name\": \"umt5_xxl_fp8_e4m3fn_scaled.safetensors\",\n   \"type\": \"wan\",\n   \"device\": \"default\"\n  }\n },\n \"3\": {\n  \"class_type\": \"VAELoader\",\n  \"inputs\": {\n   \"vae_name\": \"wan2.2_vae.safetensors\"\n  }\n },\n \"4\": {\n  \"class_type\": \"CLIPTextEncode\",\n  \"inputs\": {\n   \"text\": \"{{PROMPT}}\",\n   \"clip\": [\n    \"2\",\n    0\n   ]\n  }\n },\n \"5\": {\n  \"class_type\": \"CLIPTextEncode\",\n  \"inputs\": {\n   \"text\": \"{{NEGATIVE}}\",\n   \"clip\": [\n    \"2\",\n    0\n   ]\n  }\n },\n \"6\": {\n  \"class_type\": \"Wan22ImageToVideoLatent\",\n  \"inputs\": {\n   \"vae\": [\n    \"3\",\n    0\n   ],\n   \"width\": \"{{WIDTH}}\",\n   \"height\": \"{{HEIGHT}}\",\n   \"length\": \"{{FRAMES}}\",\n   \"batch_size\": 1\n  }\n },\n \"7\": {\n  \"class_type\": \"ModelSamplingSD3\",\n  \"inputs\": {\n   \"model\": [\n    \"1\",\n    0\n   ],\n   \"shift\": 8\n  }\n },\n \"8\": {\n  \"class_type\": \"KSampler\",\n  \"inputs\": {\n   \"model\": [\n    \"7\",\n    0\n   ],\n   \"positive\": [\n    \"4\",\n    0\n   ],\n   \"negative\": [\n    \"5\",\n    0\n   ],\n   \"latent_image\": [\n    \"6\",\n    0\n   ],\n   \"seed\": \"{{SEED}}\",\n   \"steps\": 20,\n   \"cfg\": 5,\n   \"sampler_name\": \"uni_pc\",\n   \"scheduler\": \"simple\",\n   \"denoise\": 1\n  }\n },\n \"9\": {\n  \"class_type\": \"VAEDecode\",\n  \"inputs\": {\n   \"samples\": [\n    \"8\",\n    0\n   ],\n   \"vae\": [\n    \"3\",\n    0\n   ]\n  }\n },\n \"10\": {\n  \"class_type\": \"CreateVideo\",\n  \"inputs\": {\n   \"images\": [\n    \"9\",\n    0\n   ],\n   \"fps\": 24\n  }\n },\n \"11\": {\n  \"class_type\": \"SaveVideo\",\n  \"inputs\": {\n   \"video\": [\n    \"10\",\n    0\n   ],\n   \"filename_prefix\": \"video/wan\",\n   \"format\": \"mp4\",\n   \"codec\": \"h264\"\n  }\n }\n}", "ep": "azqx3btikqf0u8"}, {"name": "Wan 2.2 5B 画像→動画 ※要検証", "type": "i2v", "wf": "{\n \"1\": {\n  \"class_type\": \"UNETLoader\",\n  \"inputs\": {\n   \"unet_name\": \"wan2.2_ti2v_5B_fp16.safetensors\",\n   \"weight_dtype\": \"default\"\n  }\n },\n \"2\": {\n  \"class_type\": \"CLIPLoader\",\n  \"inputs\": {\n   \"clip_name\": \"umt5_xxl_fp8_e4m3fn_scaled.safetensors\",\n   \"type\": \"wan\",\n   \"device\": \"default\"\n  }\n },\n \"3\": {\n  \"class_type\": \"VAELoader\",\n  \"inputs\": {\n   \"vae_name\": \"wan2.2_vae.safetensors\"\n  }\n },\n \"4\": {\n  \"class_type\": \"CLIPTextEncode\",\n  \"inputs\": {\n   \"text\": \"{{PROMPT}}\",\n   \"clip\": [\n    \"2\",\n    0\n   ]\n  }\n },\n \"5\": {\n  \"class_type\": \"CLIPTextEncode\",\n  \"inputs\": {\n   \"text\": \"{{NEGATIVE}}\",\n   \"clip\": [\n    \"2\",\n    0\n   ]\n  }\n },\n \"6\": {\n  \"class_type\": \"Wan22ImageToVideoLatent\",\n  \"inputs\": {\n   \"vae\": [\n    \"3\",\n    0\n   ],\n   \"width\": \"{{WIDTH}}\",\n   \"height\": \"{{HEIGHT}}\",\n   \"length\": \"{{FRAMES}}\",\n   \"batch_size\": 1,\n   \"start_image\": [\n    \"12\",\n    0\n   ]\n  }\n },\n \"7\": {\n  \"class_type\": \"ModelSamplingSD3\",\n  \"inputs\": {\n   \"model\": [\n    \"1\",\n    0\n   ],\n   \"shift\": 8\n  }\n },\n \"8\": {\n  \"class_type\": \"KSampler\",\n  \"inputs\": {\n   \"model\": [\n    \"7\",\n    0\n   ],\n   \"positive\": [\n    \"4\",\n    0\n   ],\n   \"negative\": [\n    \"5\",\n    0\n   ],\n   \"latent_image\": [\n    \"6\",\n    0\n   ],\n   \"seed\": \"{{SEED}}\",\n   \"steps\": 20,\n   \"cfg\": 5,\n   \"sampler_name\": \"uni_pc\",\n   \"scheduler\": \"simple\",\n   \"denoise\": 1\n  }\n },\n \"9\": {\n  \"class_type\": \"VAEDecode\",\n  \"inputs\": {\n   \"samples\": [\n    \"8\",\n    0\n   ],\n   \"vae\": [\n    \"3\",\n    0\n   ]\n  }\n },\n \"10\": {\n  \"class_type\": \"CreateVideo\",\n  \"inputs\": {\n   \"images\": [\n    \"9\",\n    0\n   ],\n   \"fps\": 24\n  }\n },\n \"11\": {\n  \"class_type\": \"SaveVideo\",\n  \"inputs\": {\n   \"video\": [\n    \"10\",\n    0\n   ],\n   \"filename_prefix\": \"video/wan\",\n   \"format\": \"mp4\",\n   \"codec\": \"h264\"\n  }\n },\n \"12\": {\n  \"class_type\": \"LoadImage\",\n  \"inputs\": {\n   \"image\": \"{{IMAGE}}\"\n  }\n }\n}", "ep": "azqx3btikqf0u8"}, {"name": "LTX 2.3 テキスト→動画 ※要ワークフロー", "type": "t2v", "wf": "/* TODO: LTX 2.3 T2V のComfyUIワークフロー(API形式)をここに貼る。ComfyUI公式テンプレートを開き「Export (API)」で書き出し、プロンプト等を {{PROMPT}} などに置換 */", "ep": "xrwpvuoxue2aht"}, {"name": "LTX 2.3 画像→動画 ※要ワークフロー", "type": "i2v", "wf": "/* TODO: LTX 2.3 I2V のComfyUIワークフロー(API形式)をここに貼る。ComfyUI公式テンプレートを開き「Export (API)」で書き出し、プロンプト等を {{PROMPT}} などに置換 */", "ep": "xrwpvuoxue2aht"}];
let cfg=JSON.parse(localStorage.getItem('myriruka')||'null')||{key:'',shared:'',models:PRESETS};
function renderModels(){$('models').innerHTML='';cfg.models.forEach((m,i)=>{const d=document.createElement('details');
d.innerHTML=`<summary>${m.name||'(無名)'}</summary><input placeholder="表示名" value="${m.name}" data-k="name"><input placeholder="エンドポイントID" value="${m.ep}" data-k="ep">
<select data-k="type">${['t2i','t2v','i2v'].map(t=>`<option ${t==m.type?'selected':''}>${t}</option>`).join('')}</select>
<textarea rows="6" placeholder="ComfyUIワークフロー(API形式JSON)" data-k="wf"></textarea><button style="background:#a33">削除</button>`;
d.querySelector('textarea').value=m.wf;d.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>m[e.dataset.k]=e.value);
d.querySelector('button').onclick=()=>{cfg.models.splice(i,1);renderModels()};$('models').appendChild(d)});
$('model').innerHTML=cfg.models.map((m,i)=>`<option value="${i}">${m.name} [${m.type}]</option>`).join('');toggle()}
function toggle(){const m=cfg.models[$('model').value];$('imgbox').style.display=m&&m.type=='i2v'?'':'none'}
$('key').value=cfg.key;$('shared').value=cfg.shared||'';renderModels();$('model').onchange=toggle;
$('add').onclick=()=>{cfg.models.push({name:'新しいモデル',ep:'',type:'i2v',wf:''});renderModels()};
$('reset').onclick=()=>{cfg.models=JSON.parse(JSON.stringify(PRESETS));renderModels()};
$('save').onclick=()=>{cfg.key=$('key').value.trim();cfg.shared=$('shared').value.trim();localStorage.setItem('myriruka',JSON.stringify(cfg));renderModels();alert('保存しました')};
let imgB64=null;$('img').onchange=e=>{const fr=new FileReader();fr.onload=()=>{imgB64=fr.result;$('prev').src=fr.result};fr.readAsDataURL(e.target.files[0])};
const api=(ep,path,body)=>fetch(`https://api.runpod.ai/v2/${ep}/${path}`,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>r.json());
function fill(wf,v){let s=wf;for(const k in v){const val=v[k];s=s.split(`"{{${k}}}"`).join(typeof val=='number'?val:JSON.stringify(val));s=s.split(`{{${k}}}`).join(String(val).replace(/["\\]/g,'\\$&').replace(/\n/g,'\\n'))}return JSON.parse(s)}
$('go').onclick=async()=>{const m0=cfg.models[$('model').value];const m=m0&&{...m0,ep:m0.ep||cfg.shared};if(!cfg.key||!m||!m.ep){alert('設定でAPIキーとエンドポイントIDを入力してください');return}
const seed=$('seed').value?+$('seed').value:Math.floor(Math.random()*2**31);
let wf;try{wf=fill(m.wf,{PROMPT:$('prompt').value,NEGATIVE:$('neg').value,SEED:seed,WIDTH:+$('w').value,HEIGHT:+$('h').value,FRAMES:+$('f').value,IMAGE:'input.jpg'})}catch(e){alert('ワークフローJSONが不正です: '+e);return}
const input={workflow:wf};if(m.type=='i2v'){if(!imgB64){alert('画像を選んでください');return}input.images=[{name:'input.jpg',image:imgB64}]}
const st=document.createElement('div');$('status').prepend(st);st.textContent='送信中…';
try{const r=await api(m.ep,'run',{input});if(!r.id)throw JSON.stringify(r);const t0=Date.now();
while(true){await new Promise(z=>setTimeout(z,3000));const s=await api(m.ep,'status/'+r.id);
st.textContent=`${m.name}: ${s.status}（${Math.round((Date.now()-t0)/1000)}秒）※初回はワーカー起動で数分かかります`;
if(s.status=='COMPLETED'){show(s.output,m,$('prompt').value);break}
if(['FAILED','CANCELLED','TIMED_OUT'].includes(s.status)){st.textContent+=' '+JSON.stringify(s.error||s.output);break}}}catch(e){st.textContent='エラー: '+e}};
function show(out,m,p){const items=(out&&(out.images||out.videos||out.gifs))||[];if(!items.length){alert('出力: '+JSON.stringify(out).slice(0,500));return}
items.forEach(it=>{const name=it.filename||'out';const isV=/\.(mp4|webm|gif)$/i.test(name)||m.type!='t2i';
const mime=/webm$/i.test(name)?'video/webm':/gif$/i.test(name)?'image/gif':isV?'video/mp4':'image/png';
const src=it.type=='s3_url'?it.data:`data:${mime};base64,${it.data}`;const c=document.createElement('div');c.className='card';
c.innerHTML=(isV&&!/gif$/i.test(name)?`<video src="${src}" controls loop></video>`:`<img src="${src}">`)+`<div>${p.slice(0,60)}</div><a href="${src}" download="${name}">⬇ ダウンロード</a>`;
$('gallery').prepend(c)})}
</script></body></html>
